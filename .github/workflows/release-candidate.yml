name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from VERSION and CHANGELOG.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: release / signed-candidate
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    environment: release-signing
    permissions:
      attestations: write # Required to attest the signed candidate.
      contents: read
      id-token: write # Required for GitHub artifact-attestation OIDC.
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify toolchain and release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p .build
          scripts/verify-ci-toolchain.sh
          scripts/verify-release-metadata.sh "$REQUESTED_VERSION"
          scripts/release-notes.sh "$REQUESTED_VERSION" > .build/release-notes.md
          [[ -s .build/release-notes.md ]]
          scripts/test.sh
      - name: Refuse a replaced or nonmonotonic version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          scripts/verify-release-history.sh "$REQUESTED_VERSION"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'error: release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'error: tag already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" |
            awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [[ -z $identity ]]; then
            printf 'error: imported archive lacks a Developer ID Application identity\n' >&2
            exit 1
          fi
          printf 'CODESIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
      - name: Archive and export signed application
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/archive-release.sh \
            .build/release/T1Plus.xcarchive \
            .build/release/export
          scripts/test-app-package.sh .build/release/export
      - name: Create and sign disk image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          artifact_name="T1-Plus-Touchpad-Support-for-macOS-$RELEASE_VERSION.dmg"
          app_path='.build/release/export/T1 Plus Touchpad Support for macOS.app'
          dmg_path=".build/release/$artifact_name"
          scripts/create-dmg.sh "$app_path" "$RELEASE_VERSION" "$dmg_path"
          codesign \
            --force \
            --identifier io.github.arun279.t1plus.disk-image \
            --sign "$CODESIGN_IDENTITY" \
            --timestamp \
            "$dmg_path"
          printf 'RELEASE_DMG=%s\n' "$dmg_path" >> "$GITHUB_ENV"
      - name: Notarize and staple disk image
        env:
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          notary_key="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          notary_result="$RUNNER_TEMP/notarization-result.json"
          notary_log="$RUNNER_TEMP/notarization-log.json"
          printf 'NOTARY_KEY_PATH=%s\n' "$notary_key" >> "$GITHUB_ENV"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$notary_key"
          xcrun notarytool submit "$RELEASE_DMG" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout 75m \
            --output-format json > "$notary_result"
          submission_id=$(jq -er '.id' "$notary_result")
          [[ $(jq -er '.status' "$notary_result") == Accepted ]]
          xcrun notarytool log "$submission_id" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            "$notary_log"
          if ! jq -e '(.issues // []) | length == 0' "$notary_log" > /dev/null; then
            jq '.issues' "$notary_log" >&2
            exit 1
          fi
          xcrun stapler staple "$RELEASE_DMG"
      - name: Verify exact distributable
        run: |
          scripts/verify-release-dmg.sh "$RELEASE_DMG"
          checksum_path="$RELEASE_DMG.sha256"
          (
            cd "$(dirname "$RELEASE_DMG")"
            shasum -a 256 "$(basename "$RELEASE_DMG")" > "$(basename "$checksum_path")"
          )
          printf 'RELEASE_CHECKSUM=%s\n' "$checksum_path" >> "$GITHUB_ENV"
      - name: Generate signed update feed
        env:
          SPARKLE_DOWNLOAD_URL_PREFIX: >-
            https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          appcast_path=.build/release/appcast.xml
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" |
            scripts/generate-appcast.sh \
              "${{ inputs.version }}" \
              "$RELEASE_DMG" \
              "$appcast_path"
          scripts/verify-appcast.sh \
            "${{ inputs.version }}" \
            "$RELEASE_DMG" \
            "$appcast_path"
          printf 'RELEASE_APPCAST=%s\n' "$appcast_path" >> "$GITHUB_ENV"
      - name: Attest release candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ env.RELEASE_DMG }}
            ${{ env.RELEASE_APPCAST }}
      - name: Stage exact candidate for the draft job
        run: |
          mkdir -p .build/candidate
          cp \
            "$RELEASE_DMG" \
            "$RELEASE_CHECKSUM" \
            "$RELEASE_APPCAST" \
            .build/release-notes.md \
            .build/candidate/
      - name: Transfer exact candidate within this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-candidate
          path: .build/candidate
          if-no-files-found: error
          retention-days: 1
      - name: Remove ephemeral signing material
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          if [[ -e $keychain_path ]]; then
            security delete-keychain "$keychain_path"
          fi
          if [[ -n ${NOTARY_KEY_PATH:-} ]]; then
            rm -f "$NOTARY_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"

  draft:
    name: release / create-draft
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: read # Required to verify candidate provenance before creating the draft.
      contents: write # Required to create the protected draft release.
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-candidate
          path: .build/candidate
      - name: Verify candidate provenance and source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          scripts/verify-release-metadata.sh "$RELEASE_VERSION"
          dmg_path=".build/candidate/T1-Plus-Touchpad-Support-for-macOS-$RELEASE_VERSION.dmg"
          checksum_path="$dmg_path.sha256"
          appcast_path=.build/candidate/appcast.xml
          notes_path=.build/candidate/release-notes.md
          [[ -f $dmg_path && -f $checksum_path && -s $appcast_path && -s $notes_path ]]
          (
            cd .build/candidate
            sha256sum --check "$(basename "$checksum_path")"
          )
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            "$dmg_path"
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            "$appcast_path"
          scripts/verify-appcast.sh "$RELEASE_VERSION" "$dmg_path" "$appcast_path"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            printf 'error: release already exists: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          {
            printf 'RELEASE_DMG=%s\n' "$dmg_path"
            printf 'RELEASE_CHECKSUM=%s\n' "$checksum_path"
            printf 'RELEASE_APPCAST=%s\n' "$appcast_path"
            printf 'RELEASE_NOTES=%s\n' "$notes_path"
          } >> "$GITHUB_ENV"
      - name: Create protected draft release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DMG" \
            "$RELEASE_CHECKSUM" \
            "$RELEASE_APPCAST" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "T1 Plus Touchpad Support $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
