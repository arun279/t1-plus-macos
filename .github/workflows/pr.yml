name: Pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / format-lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned SwiftLint in the ephemeral runner
        run: |
          tools_path=$(scripts/prepare-swiftlint-ci.sh)
          printf '%s\n' "$tools_path" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: scripts/verify-ci-toolchain.sh
      - name: Check Swift formatting and lint
        run: scripts/lint.sh swift
      - name: Check unused declarations and imports
        run: scripts/deadcode.sh

  core-tests:
    name: test / core
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: scripts/verify-ci-toolchain.sh
      - name: Test core
        run: scripts/test.sh

  ui-tests:
    name: test / ui
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: scripts/verify-ci-toolchain.sh
      - name: Operate the native application
        run: scripts/test-ui.sh
      - name: Preserve UI test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-test-diagnostics
          path: .build/UITestResults
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build / macos
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: scripts/verify-ci-toolchain.sh
      - name: Build release app
        run: scripts/build.sh Release
      - name: Archive unsigned app
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          '.build/DerivedData/Build/Products/Release/T1 Plus Touchpad Support for macOS.app'
          .build/T1PlusApp.zip
      - name: Upload unsigned app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: .build/T1PlusApp.zip
          if-no-files-found: error
          retention-days: 1

  app-package:
    name: test / app-package
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download unsigned app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-app
          path: .build/artifacts
      - name: Extract unsigned app
        run: |
          mkdir -p .build/artifacts/extracted
          ditto -x -k .build/artifacts/T1PlusApp.zip .build/artifacts/extracted
      - name: Verify app package
        run: scripts/test-app-package.sh .build/artifacts/extracted
