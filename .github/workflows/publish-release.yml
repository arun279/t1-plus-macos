name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact accepted draft version
        required: true
        type: string
      macos_acceptance_completed:
        description: Exact draft artifact passed clean-Mac and hardware acceptance
        required: true
        type: boolean
      windows_acceptance_completed:
        description: The unchanged T1 Plus passed Windows regression acceptance
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: release / publish-accepted-candidate
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.macos_acceptance_completed &&
      inputs.windows_acceptance_completed
    runs-on: macos-26
    timeout-minutes: 15
    environment: release-publish
    permissions:
      attestations: read # Required to verify candidate provenance before publication.
      contents: write # Required to publish the existing draft release.
    steps:
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release metadata and exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          scripts/verify-release-metadata.sh "$REQUESTED_VERSION"
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == true ]]
          [[ $(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish) == "$GITHUB_SHA" ]]
          expected_title="T1 Plus Touchpad Support $RELEASE_TAG"
          [[ $(gh release view "$RELEASE_TAG" --json name --jq .name) == "$expected_title" ]]
          expected_notes=$(scripts/release-notes.sh "$REQUESTED_VERSION")
          [[ $(gh release view "$RELEASE_TAG" --json body --jq .body) == "$expected_notes" ]]
          expected_assets=$(
            printf '%s\n' \
              "T1-Plus-Touchpad-Support-for-macOS-$REQUESTED_VERSION.dmg" \
              "T1-Plus-Touchpad-Support-for-macOS-$REQUESTED_VERSION.dmg.sha256" \
              appcast.xml |
              sort
          )
          actual_assets=$(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort
          )
          [[ $actual_assets == "$expected_assets" ]]
      - name: Download and verify accepted draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p .build/release-download
          gh release download "$RELEASE_TAG" --dir .build/release-download
          dmg_path=".build/release-download/T1-Plus-Touchpad-Support-for-macOS-$RELEASE_VERSION.dmg"
          checksum_path="$dmg_path.sha256"
          appcast_path=.build/release-download/appcast.xml
          [[ -f $dmg_path && -f $checksum_path && -s $appcast_path ]]
          (
            cd .build/release-download
            shasum -a 256 --check "$(basename "$checksum_path")"
          )
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            "$dmg_path"
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            "$appcast_path"
          scripts/verify-release-dmg.sh "$dmg_path"
          scripts/verify-appcast.sh "$RELEASE_VERSION" "$dmg_path" "$appcast_path"
      - name: Publish accepted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

  update_feed:
    name: release / deploy-update-feed
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      attestations: read # Required to verify the published appcast before deployment.
      contents: read
      id-token: write # Required by the GitHub Pages deployment action.
      pages: write # Required to deploy the update feed to GitHub Pages.
    steps:
      - name: Check out exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify published update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          mkdir -p .build/published-feed
          gh release download "$RELEASE_TAG" \
            --pattern appcast.xml \
            --dir .build/published-feed
          appcast_path=.build/published-feed/appcast.xml
          gh attestation verify \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            "$appcast_path"
          scripts/stage-update-feed.sh "$appcast_path" .build/update-feed
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload update feed
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/update-feed
      - name: Deploy published update feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed update feed
        env:
          APPCAST_URL: >-
            https://arun279.github.io/t1-plus-macos/appcast.xml?release=${{ inputs.version }}
        run: scripts/verify-served-update-feed.sh .build/published-feed/appcast.xml "$APPCAST_URL"
