name: Security

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read # Zizmor uses workflow metadata for online audits.
  contents: read # Checkout and Gitleaks read the repository history.

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security / secrets-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools in the ephemeral runner
        id: tools
        run: |
          tools_path=$(scripts/install-ci-tools.sh)
          printf '%s\n' "$tools_path" >> "$GITHUB_PATH"
      - name: Verify Developer Certificate of Origin sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_COMMIT" "$HEAD_COMMIT"
      - name: Check shell and workflow sources
        run: scripts/lint.sh portable
      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner .
      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-confidence: medium
          min-severity: low
          persona: pedantic
          version: 1.29.0
